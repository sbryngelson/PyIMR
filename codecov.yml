# Codecov is here to show which branches of the configuration space nothing
# exercises -- the false arm of a `bubtherm` or `masstrans` guard is the kind of
# gap this package actually has. It is NOT a gate: the numerical claims are made
# by the validation suite, and a percentage cannot express them.
#
# `informational: true` on both targets is what makes that concrete. Codecov
# reports the change and never marks the check failed, so a refactor that moves
# a covered line does not block a pull request.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, diff, files"
  require_changes: true

ignore:
  - "tests/**"
  - "tools/**"
