[build-system]
# >=77 for PEP 639: `license` as an SPDX expression and `license-files`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "PyIMR"
version = "0.3.0"
description = "Fast, validated solvers for inertial microcavitation rheometry"
readme = "README.md"
authors = [{ name = "Spencer Bryngelson", email = "sbryngelson@gmail.com" }]
keywords = ["cavitation", "rheometry", "bubble-dynamics", "jax", "inverse-problems"]
# PEP 639: an SPDX expression, not the legacy `{text = ...}` table, and no
# `License ::` classifier -- those are deprecated and setuptools rejects pairing
# them with an expression. Needs setuptools>=77, pinned in [build-system].
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
# 3.12 because jax requires it, and jax is not optional. See PLAN.md W11 stage 5.
requires-python = ">=3.12"
dependencies = [
    "diffrax>=0.6",
    "jax>=0.4",
    "numba>=0.63",
    "numpy>=2.0",
    "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/sbryngelson/PyIMR"
Repository = "https://github.com/sbryngelson/PyIMR"
Changelog = "https://github.com/sbryngelson/PyIMR/blob/master/CHANGELOG.md"
Issues = "https://github.com/sbryngelson/PyIMR/issues"

[project.optional-dependencies]
# Optional on purpose: PyMC pulls pytensor, arviz, pandas and xarray, which is a
# large addition to a core install of numpy/scipy/numba. `pyimr.pymc_op`
# is the only module that needs it, and it imports lazily so the rest of the package works
# without it. See #25.
inference = [
    "pymc>=6",
]
# Documentation is generated rather than written: #8 stripped docstrings from
# internals and kept them on everything named in `__all__`, so "everything
# public is documented, everything documented is public" holds by construction
# -- which is exactly pdoc's assumption. See #30.
docs = [
    "pdoc>=15",
]
test = [
    "build>=1.2",
    # Pinned: pyright's inference changes between releases, and
    # tools/pyright_baseline.json records exact diagnostics. A floating
    # version would make the baseline drift for reasons unrelated to the code.
    "pyright==1.1.411",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-xdist>=3.6",
    "ruff>=0.15",
]

[tool.setuptools.packages.find]
# Discovered, not listed. The hand-maintained `py-modules` array this replaces
# was forgotten twice during file splits (#34) and needed an edit for every new
# module; discovery makes the list structural instead. See #61.
#
# `include` is required, not decoration: the package sits at the repo root, so
# unfiltered discovery also sweeps up tests/, tools/, docs/ and benchmarks/.
where = ["."]
include = ["pyimr*"]

[tool.pyright]
# Deliberately no `venvPath`/`venv`: CI installs into the interpreter that
# `actions/setup-python` provides and has no `.venv` at all, so pinning one here
# would resolve to nothing there and turn every third-party import into
# `reportMissingImports`. The environment is supplied per-run instead, by
# `tools/pyright_baseline.py --pythonpath`, which is correct in both places.
# Run the type check through that tool, not bare `pyright`.

# The floor of `requires-python`, not the local interpreter. Checking against the
# oldest supported version is what catches use of newer syntax or stdlib.
pythonVersion = "3.12"
pythonPlatform = "Linux"

# Explicit, so a pyright release that changes its default does not silently move
# the gate. "standard" is what the 65-diagnostic baseline was recorded under.
typeCheckingMode = "standard"

include = ["pyimr", "tests", "tools", "benchmarks"]

# Build artefacts are a second copy of the whole package. Without this, anyone
# who runs `python -m build` before the type check sees every diagnostic twice
# and the baseline reports a flood of "new" errors. CI happens to build after
# type checking, which is why this went unnoticed.
exclude = ["build", "dist", ".venv", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.coverage.run]
# Branch coverage: behaviour is selected by configuration flags, so a fully-covered
# `if` whose false arm never runs is the gap worth seeing.
branch = true
source = ["pyimr"]
# xdist runs one process per worker, which would otherwise overwrite one data file.
parallel = true

[tool.coverage.report]
exclude_also = [
    # Reached only by a missing dependency, which the CI install always provides.
    "raise ImportError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 150
indent-width = 2
# ruff formats Python blocks inside markdown. README examples are written for a
# reader -- expanded imports, one argument per line, 4-space indent -- which is
# deliberately not the source style.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Default E4/E7/E9 + F, minus the dense idioms this codebase uses
# deliberately: multi-import lines, module imports after a path shim,
# semicolon/colon multi-statements, assigned lambdas, short math names.
select = ["E4", "E7", "E9", "F"]
ignore = ["E401", "E402", "E701", "E702", "E703", "E731", "E741"]
