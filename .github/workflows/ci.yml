name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PyMC 6 requires Python >= 3.12 while this package supports 3.10, so the
      # inference extra is installable on only part of the matrix. The 3.10 job
      # therefore covers the core install -- which is what a user without the
      # extra actually gets -- and tests/test_pymc_bridge.py skips there.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          extra=$([ "${{ matrix.python-version }}" = "3.10" ] && echo "test" || echo "test,inference")
          python -m pip install -e ".[$extra]"

      # -rA prints one line per test, so a failure names itself in the log
      # instead of requiring a search for which check moved.
      - name: Tests and numerical validation
        run: python -m pytest -rA

      # The repo settled on `ruff format` in #17, but CI only ever ran
      # `ruff check`, which does not enforce it -- so formatting drifted
      # unnoticed. Both now run.
      - name: Static checks
        run: python -m ruff check . && python -m ruff format --check .

      # Gates on NEW type errors only; the pre-existing ones are recorded in
      # tools/pyright_baseline.json (issue #33). One version, because pyright
      # infers differently across releases and a matrix would need a baseline
      # per entry.
      - name: Type check
        if: matrix.python-version == '3.12'
        run: python tools/pyright_baseline.py

      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: python -m build
