[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "imr-fast"
version = "0.1.0"
description = "Fast, validated solvers for inertial microcavitation rheometry"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
test = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.15",
]

[tool.setuptools]
py-modules = [
    "constitutive",
    "imr_fast",
    "imr_grad",
    "imr_nonlinear",
    "thermal_fd",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "I"]
