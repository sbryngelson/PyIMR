[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "imr-fast"
version = "0.3.0"
description = "Fast, validated solvers for inertial microcavitation rheometry"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numba>=0.63",
    "numpy>=2.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
test = [
    "build>=1.2",
    # Pinned: pyright's inference changes between releases, and
    # tools/pyright_baseline.json records exact diagnostics. A floating
    # version would make the baseline drift for reasons unrelated to the code.
    "pyright==1.1.411",
    "pytest>=8",
    "ruff>=0.15",
]

[tool.setuptools]
py-modules = [
    "_imr_autodiff",
    "_imr_config",
    "_imr_dual",
    "_imr_materials",
    "_imr_prepare",
    "_imr_mechanical",
    "_imr_rhs",
    "_imr_stress",
    "_imr_thermal",
    "imr_data",
    "imr_fast",
    "imr_inference",
    "imr_sensitivity",
    "thermal_fd",
    "thermal_spectral",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
line-length = 120
indent-width = 2
# ruff formats Python blocks inside markdown. README examples are written for a
# reader -- expanded imports, one argument per line, 4-space indent -- which is
# deliberately not the source style.
extend-exclude = ["*.md"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
# Default E4/E7/E9 + F, minus the dense idioms this codebase uses
# deliberately: multi-import lines, module imports after a path shim,
# semicolon/colon multi-statements, assigned lambdas, short math names.
select = ["E4", "E7", "E9", "F"]
ignore = ["E401", "E402", "E701", "E702", "E703", "E731", "E741"]
