name: CI

on:
  # `push` on every branch made a branch with an open PR run the whole matrix
  # TWICE, once per event. Restricting it to master keeps master's caches, which
  # are the ones every branch can restore from.
  push:
    branches: [master]
  pull_request:
  # The convergence studies are 11 tests and 135 s of a 200 s suite, and they gate
  # nothing a push can break in isolation. They run nightly instead, and on demand.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# A new push supersedes the run it interrupted; nothing is learned by finishing
# the old one. Not applied to master, whose caches later runs depend on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A deadlocked test would otherwise sit until GitHub's 6-hour default. The
    # `workers > 1` paths fork subprocesses, and that is exactly how they used to hang.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    # Set the cache location EXPLICITLY rather than letting the package derive
    # `~/.cache/pyimr/jax` from `XDG_CACHE_HOME`. If a runner image ever sets
    # that variable the derived path moves, the `actions/cache` path stops
    # matching, and caching silently does nothing while still appearing green.
    env:
      IMR_FAST_JAX_CACHE: ${{ github.workspace }}/.xla-cache
      # No XLA_FLAGS. `--xla_cpu_max_isa=AVX2` was here to make compilations portable
      # across runner CPUs, on the theory that non-portable keys caused the cache misses.
      # That theory was wrong: the misses came from a prune cap below the working set
      # (#123), and a job was later measured restoring 450 entries and REUSING them, so
      # keys were already portable without the pin. It cost 3.6% of throughput for a
      # problem it was not solving. Its own comment said to drop it if hit rates did not
      # improve; they did not.
      # Everything on the nightly and on demand; the fast set per push.
      PYTEST_MARKERS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'slow or not slow' || 'not slow' }}
      # Nightly only. Measured on the first push that carried it: the 3.12 test step went
      # from ~200 s to 319 s, and the three jobs run in parallel so 3.12 sets the wall
      # clock. That put every push over the five-minute target (#123), which is worth more
      # here than per-review coverage -- the numerical claims are the suite's, not a
      # percentage's. Coverage still lands once a day.
      COVERAGE: ${{ matrix.python-version == '3.12' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}

    steps:
      - uses: actions/checkout@v4

      # `cache-dependency-path` is not optional here. setup-python's pip cache
      # keys on `**/requirements.txt` by default, and this project has none, so
      # `cache: pip` alone was hashing nothing and every job re-downloaded the
      # world -- jaxlib is ~100 MB of that.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # One extra set for every job now. The 3.10 entry and the two-tier install it
      # forced are both gone: jax is a core dependency after W11 stage 5 and
      # requires 3.12, which is the package's floor too. PyMC needs the same, so
      # `inference` no longer splits the matrix either.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,inference]"

      # The jaxlib version belongs in the cache key. XLA entries are keyed
      # internally by HLO hash, so a jaxlib upgrade cannot return a wrong entry --
      # but every old entry would be restored, never hit, and written back, so the
      # archive grows without ever paying off. Scoping the lineage to the version
      # keeps restores relevant and lets the stale generation age out.
      - name: Resolve jaxlib version
        id: jaxlib
        run: python -c "import jaxlib, os; print(f'version={jaxlib.__version__}', file=open(os.environ['GITHUB_OUTPUT'], 'a'))"

      # The XLA compilation cache `pyimr._jax._enable_compilation_cache`
      # configures. Measured 64.0 s cold against 29.7 s warm on
      # tests/test_backend_jax.py; tracing is Python and paid either way.
      #
      # Keyed on the SOURCE that determines the programs, not on the commit. At
      # ~326 MB per job a commit-keyed cache wrote ~900 MB per push, so the 10 GB
      # repository budget churned every ten commits and evicted the pip caches
      # alongside. Hashing pyimr/ and tests/ means a docs commit reuses the entry
      # outright, while anything that can change an HLO rotates it.
      #
      # This workflow is in the hash too, because it sets the cache POLICY. A key
      # is write-once -- `actions/cache` skips the save when the key already
      # exists -- so without this, changing the cap or the prune leaves the old
      # archive frozen and the change cannot take effect until src happens to
      # move. That is exactly what happened to the 700 -> 4000 cap fix.
      #
      # A stale entry cannot be wrong, only missed: XLA keys entries by HLO hash.
      - name: Cache XLA compilations
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.xla-cache
          key: xla-${{ matrix.python-version }}-${{ steps.jaxlib.outputs.version }}-${{ hashFiles('pyimr/**/*.py', 'tests/**/*.py', '.github/workflows/ci.yml') }}
          restore-keys: xla-${{ matrix.python-version }}-${{ steps.jaxlib.outputs.version }}-

      # Proof the cache is doing its job, rather than an assumption that it is. A
      # silent miss looks exactly like a slow runner in the timings.
      - name: Report XLA cache state
        run: |
          echo "restored: ${{ steps.jaxlib.outputs.version }} / python ${{ matrix.python-version }}"
          find "$IMR_FAST_JAX_CACHE" -type f 2>/dev/null | wc -l | xargs echo "entries before tests:"
          du -sh "$IMR_FAST_JAX_CACHE" 2>/dev/null || echo "cold: no cache directory yet"

      # -rA prints one line per test, so a failure names itself in the log
      # instead of requiring a search for which check moved.
      #
      # `-n auto`: the cost is numerical integration, which divides across processes.
      # Coverage on one matrix entry only -- three identical reports add nothing.
      # Coverage costs about 160 s under tracing -- measured 405 s against 244 s on
      # the same cache state -- so it runs on the nightly rather than per push. It is
      # informational and never blocks, so the delay costs nothing a push depends on.
      - name: Tests and numerical validation
        if: env.COVERAGE != 'true'
        run: python -m pytest -rA -n auto --dist loadfile -m "$PYTEST_MARKERS"

      - name: Tests and numerical validation (with coverage)
        if: env.COVERAGE == 'true'
        run: python -m pytest -rA -n auto --dist loadfile -m "$PYTEST_MARKERS" --cov --cov-report=xml

      # `fail_ci_if_error: false` below means the upload step goes green whether or not the
      # report lands, and that hid a total failure: the only upload this repo has ever
      # attempted logged `Token length: 0` and `Token required - not valid tokenless
      # upload`, while the step reported success. Zero reports across 172 pushes, 113 pull
      # requests and 1 nightly.
      #
      # A missing token is a configuration defect, not the service outage that flag exists
      # to tolerate. So it is checked separately, and loudly.
      - name: Check the Codecov token is set
        if: env.COVERAGE == 'true'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "$CODECOV_TOKEN" ]; then
            echo "::error::CODECOV_TOKEN is not set, so the upload would report success and deliver nothing."
            exit 1
          fi
          echo "CODECOV_TOKEN is set"

      # Must not fail the build: a coverage service being down is not a defect here.
      - name: Upload coverage to Codecov
        if: env.COVERAGE == 'true'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
          # Flagged by which tests ran. Only `full` is reachable while coverage is nightly
          # only, but the conditional stays: if per-push coverage is ever re-enabled, a
          # `not slow` report compared against a `slow or not slow` base would read as a
          # coverage drop that is really a marker difference.
          flags: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'fast' }}

      # Bound the archive before `actions/cache` saves it. The cap MUST stay above the
      # suite's working set (912 for `not slow`, more for the nightly). Below it, every
      # run prunes: restored entries carry old mtimes, so the save keeps the half just
      # compiled and drops the half just restored, and the next run recompiles that
      # half instead. Measured under a 700 cap -- 450 in, 910 out, prune to 455, on
      # every run, costing ~160 s of the ~300 s test step.
      - name: Bound and report the XLA cache
        if: always()
        run: |
          count=$(find "$IMR_FAST_JAX_CACHE" -type f 2>/dev/null | wc -l)
          echo "entries after tests: $count"
          if [ "$count" -gt 4000 ]; then
            find "$IMR_FAST_JAX_CACHE" -type f -printf '%T@ %p\n' | sort -n | head -n $((count - 3000)) | cut -d' ' -f2- | xargs -r rm -f
            echo "over cap, pruned oldest -> $(find "$IMR_FAST_JAX_CACHE" -type f | wc -l) entries"
          fi
          du -sh "$IMR_FAST_JAX_CACHE" 2>/dev/null || true

      # `ruff format` is deliberately NOT run. It explodes `if x: return y`
      # into three lines and mandates blank lines between definitions, which
      # is the whole of the density this codebase is written for -- the lint
      # ignore list (E701/E702/E703) has licensed those idioms since W7 while
      # the formatter kept undoing them. Density is the author's job now; the
      # correctness lints still run.
      - name: Static checks
        run: python -m ruff check .

      # The baseline is empty as of #142, so this gates on zero. The wrapper stays
      # because it supplies --pythonpath; a bare `pyright` resolves against the wrong
      # interpreter and reports every third-party import as missing. One version,
      # because pyright infers differently across releases.
      - name: Type check
        if: matrix.python-version == '3.12'
        run: python tools/pyright_baseline.py

      # The point is not to publish, it is that a docstring which no longer
      # parses -- a bad cross-reference, a broken code block -- fails here
      # rather than silently degrading. Output is not committed (#30).
      - name: Build API documentation
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install "pdoc>=15"
          python -m pdoc -o site pyimr pyimr.sensitivity pyimr.inference pyimr.data pyimr.design pyimr.pymc_op pyimr.assimilation pyimr.optimize

      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: python -m build
